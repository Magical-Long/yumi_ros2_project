# MoveIt 到执行控制器的映射关系。
# 当前配置面向 trajectory controller 执行链。
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  # MoveIt 可见的控制器名称列表。
  controller_names:
    - left_arm_controller
    - right_arm_controller

  left_arm_controller:
    # action 命名空间，最终 action 名通常为
    # /left_arm_controller/follow_joint_trajectory
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    # default=true 表示 MoveIt 优先用这个控制器执行对应关节集合。
    default: true
    # 该控制器实际负责的关节集合。
    joints:
      - yumi_joint_1_l
      - yumi_joint_2_l
      - yumi_joint_7_l
      - yumi_joint_3_l
      - yumi_joint_4_l
      - yumi_joint_5_l
      - yumi_joint_6_l

  right_arm_controller:
    # action 命名空间，最终 action 名通常为
    # /right_arm_controller/follow_joint_trajectory
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    # default=true 表示 MoveIt 优先用这个控制器执行对应关节集合。
    default: true
    # 该控制器实际负责的关节集合。
    joints:
      - yumi_joint_1_r
      - yumi_joint_2_r
      - yumi_joint_7_r
      - yumi_joint_3_r
      - yumi_joint_4_r
      - yumi_joint_5_r
      - yumi_joint_6_r
