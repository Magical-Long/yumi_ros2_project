# 轨迹模式专用 ros2_control 配置。
# 适合 MoveIt 直接执行、回 home、自由空间规划验证。
controller_manager:
  ros__parameters:
    # controller_manager 主循环频率，单位 Hz。
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    # 左臂 joint trajectory controller 的关节顺序。
    joints: [yumi_joint_1_l, yumi_joint_2_l, yumi_joint_7_l, yumi_joint_3_l, yumi_joint_4_l, yumi_joint_5_l, yumi_joint_6_l]
    # 当前 traj 版只接受 position 命令。
    command_interfaces: [position]
    # 上层可读取的位置和速度状态接口。
    state_interfaces: [position, velocity]

right_arm_controller:
  ros__parameters:
    # 右臂 joint trajectory controller 的关节顺序。
    joints: [yumi_joint_1_r, yumi_joint_2_r, yumi_joint_7_r, yumi_joint_3_r, yumi_joint_4_r, yumi_joint_5_r, yumi_joint_6_r]
    # 当前 traj 版只接受 position 命令。
    command_interfaces: [position]
    # 上层可读取的位置和速度状态接口。
    state_interfaces: [position, velocity]
