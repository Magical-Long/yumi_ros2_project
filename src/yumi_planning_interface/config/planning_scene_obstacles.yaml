yumi_planning_scene_obstacles:
  ros__parameters:
    # 所有静态障碍物的参考坐标系。
    # 需要和 MoveIt planning frame / Gazebo world 对齐；当前系统统一使用 world。
    frame_id: world

    # 启动后周期性重发几次，避免节点刚启动时 move_group 的 PlanningScene service 尚未完全 ready。
    apply_period_sec: 1.0
    max_apply_attempts: 5

    # 每个名字对应一个 box。
    # box_sizes 每 3 个数为一组: [x_size, y_size, z_size]
    # box_poses 每 6 个数为一组: [x, y, z, roll, pitch, yaw]
    obstacle_names: [unit_box]
    box_sizes: [
      0.20, 0.20, 0.20
    ]
    box_poses: [
      0.350, 0.00, 0.10, 0.0, 0.0, 0.0
    ]
